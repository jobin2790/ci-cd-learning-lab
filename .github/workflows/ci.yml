name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests and generate coverage report
        shell: bash
        run: |
          mkdir -p test-reports
          set -o pipefail
          python -m coverage run --source=app -m unittest discover -s tests -v 2>&1 | tee "test-reports/test-report-python-${{ matrix.python-version }}.txt"
          python -m coverage report -m
          python -m coverage xml -o "test-reports/coverage-python-${{ matrix.python-version }}.xml"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            test-reports/test-report-python-${{ matrix.python-version }}.txt
            test-reports/coverage-python-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 7