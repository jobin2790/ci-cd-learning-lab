name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests and generate report
        shell: bash
        run: |
          mkdir -p test-reports
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "test-reports/test-report-python-${{ matrix.python-version }}.txt"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-python-${{ matrix.python-version }}
          path: test-reports/test-report-python-${{ matrix.python-version }}.txt
          if-no-files-found: warn
          retention-days: 7
