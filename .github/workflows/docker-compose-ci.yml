name: Docker Compose CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: docker compose -f cicd-day22/docker-compose.yml config

      - name: Build Docker Compose Services
        run: docker compose -f cicd-day22/docker-compose.yml build

      - name: Start Flask and Redis Containers
        run: docker compose -f cicd-day22/docker-compose.yml up -d

      - name: Wait for Flask Application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5003/health; then
              echo "Flask application is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to start"
          exit 1

      - name: Verify Application
        run: |
          curl -f http://localhost:5003/

      - name: Verify Redis
        run: |
          docker compose -f cicd-day22/docker-compose.yml exec -T redis redis-cli ping

      - name: Show Container Logs on Failure
        if: failure()
        run: docker compose -f cicd-day22/docker-compose.yml logs

      - name: Stop Containers
        if: always()
        run: docker compose -f cicd-day22/docker-compose.yml down
